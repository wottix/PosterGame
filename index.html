<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Scan to Play</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 20px; background: #101525; color: #f5f7ff; font: 16px system-ui, sans-serif; }
    main { width: min(100%, 430px); text-align: center; }
    h1 { font-size: 2.5rem; margin-bottom: 8px; }
    p { color: #c1cbe0; }
    .camera { position: relative; margin: 24px 0 16px; aspect-ratio: 1; overflow: hidden; border: 2px solid #53658b; border-radius: 22px; background: #080c16; }
    video { width: 100%; height: 100%; object-fit: cover; }
    .frame { position: absolute; inset: 18%; border: 3px solid #7df5c7; border-radius: 16px; pointer-events: none; }
    button, .play { display: inline-block; border: 0; border-radius: 12px; padding: 14px 22px; background: #7df5c7; color: #10231e; font: inherit; font-weight: 700; text-decoration: none; cursor: pointer; }
    button:disabled { opacity: .65; cursor: wait; }
    .controls { display: flex; justify-content: center; gap: 10px; }
    .stop { background: #e7edf7; color: #172033; }
    #status { min-height: 1.5em; }
  </style>
</head>
<body>
  <main>
    <h1>Scan to Play</h1>
    <p>Point your phone camera at the QR code on the poster.</p>
    <div class="camera"><video id="video" autoplay muted playsinline aria-label="Camera preview"></video><div class="frame" aria-hidden="true"></div></div>
    <div class="controls"><button id="start">Start camera</button><button id="stop" class="stop" disabled>Stop camera</button></div>
    <p id="status" role="status">Camera permission is needed to scan.</p>
    <div id="result" hidden></div>
    <p>Once scanned, tap Play to open the game.</p>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
  <script>
    const video = document.querySelector('#video');
    const start = document.querySelector('#start');
    const stop = document.querySelector('#stop');
    const status = document.querySelector('#status');
    const result = document.querySelector('#result');
    let stream;
    let scanning = false;

    function stopCamera() {
      scanning = false;
      stream?.getTracks().forEach(track => track.stop());
      stream = null;
      video.srcObject = null;
      stop.disabled = true;
    }

    async function scan() {
      const detector = 'BarcodeDetector' in window
        ? new BarcodeDetector({ formats: ['qr_code'] })
        : null;
      if (!detector && typeof window.jsQR !== 'function') {
        status.textContent = 'QR scanning could not load. Check your internet connection and reload.';
        stopCamera();
        return;
      }
      const canvas = document.createElement('canvas');
      const context = canvas.getContext('2d', { willReadFrequently: true });
      scanning = true;
      status.textContent = 'Scanning for the game QR code…';
      while (scanning) {
        if (video.readyState >= 2 && video.videoWidth) {
          try {
            let value;
            if (detector) {
              value = (await detector.detect(video))[0]?.rawValue;
            } else {
              canvas.width = video.videoWidth;
              canvas.height = video.videoHeight;
              context.drawImage(video, 0, 0, canvas.width, canvas.height);
              value = window.jsQR(context.getImageData(0, 0, canvas.width, canvas.height).data, canvas.width, canvas.height)?.data;
            }
            if (value) {
              let url;
              try { url = new URL(value); } catch { url = null; }
              if (!url || !['https:', 'http:'].includes(url.protocol)) {
                status.textContent = 'This QR code is not a valid game link. Keep scanning.';
              } else {
                scanning = false;
                stopCamera();
                status.textContent = 'Game found!';
                result.replaceChildren();
                const link = document.createElement('a');
                link.className = 'play';
                link.href = url.href;
                link.target = '_blank';
                link.rel = 'noopener noreferrer';
                link.textContent = 'Play game';
                result.append(link);
                result.hidden = false;
              }
            }
          } catch { /* Retry on the next camera frame. */ }
        }
        await new Promise(resolve => setTimeout(resolve, 200));
      }
    }

    start.addEventListener('click', async () => {
      start.disabled = true;
      result.hidden = true;
      status.textContent = 'Starting camera…';
      if (!window.isSecureContext || !navigator.mediaDevices?.getUserMedia) {
        status.textContent = 'Camera access requires HTTPS. Open this page using a secure link.';
        start.disabled = false;
        return;
      }
      try {
        stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: 'environment' } }, audio: false });
        video.srcObject = stream;
        await video.play();
        stop.disabled = false;
        await scan();
      } catch {
        stopCamera();
        status.textContent = 'Camera unavailable. Allow camera access and try again.';
      } finally {
        start.disabled = false;
      }
    });
    stop.addEventListener('click', () => {
      stopCamera();
      status.textContent = 'Camera stopped.';
      start.disabled = false;
    });
    window.addEventListener('pagehide', stopCamera);
  </script>
</body>
</html>
