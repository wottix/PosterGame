<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <title>CHKO Labské Pískovce</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: #ffffff; color: #17231d; font: 16px system-ui, sans-serif; }
    main { width: min(100%, 440px); text-align: center; }
    h1 { margin: 0 0 10px; font-size: 2rem; line-height: 1.2; }
    .subtitle { margin: 0; color: #315343; font-size: 1.2rem; font-weight: 600; }
    .camera { position: relative; margin: 28px 0 18px; aspect-ratio: 1; overflow: hidden; border: 1px solid #d6e0d9; border-radius: 12px; background: #f4f7f5; }
    video { width: 100%; height: 100%; object-fit: cover; }
    .frame { position: absolute; inset: 18%; border: 3px solid #3b8b5a; border-radius: 12px; pointer-events: none; }
    button, .play { display: inline-block; border: 0; border-radius: 8px; padding: 14px 20px; background: #287347; color: #ffffff; font: inherit; font-weight: 700; text-decoration: none; cursor: pointer; }
    button:disabled { opacity: .6; cursor: wait; }
    .controls { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; }
    .stop { background: #ffffff; color: #263b30; border: 1px solid #b8c8bd; }
    #status { min-height: 1.5em; color: #40564a; }
    @media (max-width: 360px) { body { padding: 16px; } .controls { flex-direction: column; } }
  </style>
</head>
<body>
  <main>
    <h1>CHKO Labské Pískovce</h1>
    <p class="subtitle">Naskenujte plakát!</p>
    <div class="camera"><video id="video" autoplay muted playsinline aria-label="Náhled kamery"></video><div class="frame" aria-hidden="true"></div></div>
    <div class="controls"><button id="start">Spustit kameru</button><button id="stop" class="stop" disabled>Zastavit kameru</button></div>
    <p id="status" role="status">Pro skenování povolte přístup ke kameře.</p>
    <div id="result" hidden></div>
    <p>Po naskenování otevřete hru tlačítkem níže.</p>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
  <script>
    const video = document.querySelector('#video');
    const start = document.querySelector('#start');
    const stop = document.querySelector('#stop');
    const status = document.querySelector('#status');
    const result = document.querySelector('#result');
    let stream;
    let scanning = false;

    function stopCamera() {
      scanning = false;
      stream?.getTracks().forEach(track => track.stop());
      stream = null;
      video.srcObject = null;
      stop.disabled = true;
    }

    async function scan() {
      const detector = 'BarcodeDetector' in window
        ? new BarcodeDetector({ formats: ['qr_code'] })
        : null;
      if (!detector && typeof window.jsQR !== 'function') {
        status.textContent = 'Skenování QR kódů se nepodařilo načíst. Zkontrolujte připojení k internetu a obnovte stránku.';
        stopCamera();
        return;
      }
      const canvas = document.createElement('canvas');
      const context = canvas.getContext('2d', { willReadFrequently: true });
      scanning = true;
      status.textContent = 'Hledám QR kód hry…';
      while (scanning) {
        if (video.readyState >= 2 && video.videoWidth) {
          try {
            let value;
            if (detector) {
              value = (await detector.detect(video))[0]?.rawValue;
            } else {
              canvas.width = video.videoWidth;
              canvas.height = video.videoHeight;
              context.drawImage(video, 0, 0, canvas.width, canvas.height);
              value = window.jsQR(context.getImageData(0, 0, canvas.width, canvas.height).data, canvas.width, canvas.height)?.data;
            }
            if (value) {
              let url;
              try { url = new URL(value); } catch { url = null; }
              if (!url || !['https:', 'http:'].includes(url.protocol)) {
                status.textContent = 'Tento QR kód neobsahuje platný odkaz. Pokračuji ve skenování.';
              } else {
                scanning = false;
                stopCamera();
                status.textContent = 'Hra nalezena!';
                result.replaceChildren();
                const link = document.createElement('a');
                link.className = 'play';
                link.href = url.href;
                link.target = '_blank';
                link.rel = 'noopener noreferrer';
                link.textContent = 'Spustit hru';
                result.append(link);
                result.hidden = false;
              }
            }
          } catch { /* Zkusí další snímek kamery. */ }
        }
        await new Promise(resolve => setTimeout(resolve, 200));
      }
    }

    start.addEventListener('click', async () => {
      start.disabled = true;
      result.hidden = true;
      status.textContent = 'Spouštím kameru…';
      if (!window.isSecureContext || !navigator.mediaDevices?.getUserMedia) {
        status.textContent = 'Přístup ke kameře vyžaduje zabezpečené připojení HTTPS.';
        start.disabled = false;
        return;
      }
      try {
        stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: 'environment' } }, audio: false });
        video.srcObject = stream;
        await video.play();
        stop.disabled = false;
        await scan();
      } catch {
        stopCamera();
        status.textContent = 'Kameru se nepodařilo spustit. Povolte přístup ke kameře a zkuste to znovu.';
      } finally {
        start.disabled = false;
      }
    });
    stop.addEventListener('click', () => {
      stopCamera();
      status.textContent = 'Kamera je vypnutá.';
      start.disabled = false;
    });
    window.addEventListener('pagehide', stopCamera);
  </script>
</body>
</html>
